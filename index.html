<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jogo da Velha</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>Jogo da Velha</h1>

    <h2 id="status">
      Vez do jogador X
    </h2>

    <!-- MODOS -->
    <div class="modes">

      <button
        class="mode-btn active"
        id="soloBtn"
      >
        Solo 🤖
      </button>

      <button
        class="mode-btn"
        id="multiBtn"
      >
        2 Jogadores 👥
      </button>

    </div>

    <!-- TABULEIRO -->
    <div class="tabuleiro">

      <div class="celula" data-index="0"></div>
      <div class="celula" data-index="1"></div>
      <div class="celula" data-index="2"></div>

      <div class="celula" data-index="3"></div>
      <div class="celula" data-index="4"></div>
      <div class="celula" data-index="5"></div>

      <div class="celula" data-index="6"></div>
      <div class="celula" data-index="7"></div>
      <div class="celula" data-index="8"></div>

    </div>

    <!-- PLACAR -->
    <div class="scoreboard">

      <div class="score">
        X
        <span id="scoreX">0</span>
      </div>

      <div class="score">
        Empates
        <span id="draws">0</span>
      </div>

      <div class="score">
        O
        <span id="scoreO">0</span>
      </div>

    </div>

    <button id="reiniciar">
      Reiniciar
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
